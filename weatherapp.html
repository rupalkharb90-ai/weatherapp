<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:linear-gradient(135deg,#4facfe,#00f2fe);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container{
        background:white;
        padding:30px;
        border-radius:15px;
        text-align:center;
        width:350px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
        margin-bottom:20px;
        color:#333;
    }

    input{
        width:100%;
        padding:12px;
        border:2px solid #ddd;
        border-radius:8px;
        margin-bottom:15px;
        font-size:16px;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        background:#4facfe;
        color:white;
        font-size:16px;
        border-radius:8px;
        cursor:pointer;
    }

    button:hover{
        background:#2d8cff;
    }

    .weather{
        margin-top:20px;
    }

    .temp{
        font-size:40px;
        font-weight:bold;
        color:#333;
    }

    .city{
        font-size:24px;
        color:#666;
        margin-top:10px;
    }

    .condition{
        font-size:18px;
        color:#777;
        margin-top:10px;
    }

    img{
        width:80px;
        margin-top:10px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Weather App</h1>

    <input type="text" id="location" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <div class="weather" id="weatherResult"></div>
</div>

<script>
async function getWeather() {
    const location = document.getElementById("location").value.trim();

    if(location === ""){
        alert("Please enter a location");
        return;
    }

    const apiKey = "f0d3951f3a074413ba674655260606";
    const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${location}&aqi=yes`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if(data.error){
            document.getElementById("weatherResult").innerHTML =
                `<p>${data.error.message}</p>`;
            return;
        }

        document.getElementById("weatherResult").innerHTML = `
            <div class="temp">${data.current.temp_c}°C</div>
            <div class="city">${data.location.name}, ${data.location.country}</div>
            <img src="https:${data.current.condition.icon}" alt="Weather Icon">
            <div class="condition">${data.current.condition.text}</div>
            <p><strong>Humidity:</strong> ${data.current.humidity}%</p>
            <p><strong>Wind:</strong> ${data.current.wind_kph} km/h</p>
        `;
    }
    catch(error){
        document.getElementById("weatherResult").innerHTML =
            `<p>Failed to fetch weather data.</p>`;
    }
}
</script>

</body>
</html>
